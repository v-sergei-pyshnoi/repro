name: Rustup macOS 15 action repro

on:
  workflow_dispatch:

jobs:
  repro:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS 15 ARM64
            os: macos-15
          - name: macOS 15 Intel
            os: macos-15-intel

    runs-on: ${{ matrix.os }}

    steps:
      - name: Print runner/image info
        shell: bash
        run: |
          set -x

          echo "runner.os=${{ runner.os }}"
          echo "runner.arch=${{ runner.arch }}"
          echo "matrix.os=${{ matrix.os }}"

          echo "ImageOS=${ImageOS:-}"
          echo "ImageVersion=${ImageVersion:-}"

          sw_vers
          uname -a
          arch

          echo "PATH=$PATH"

          echo "=== Runner image metadata ==="
          cat /imagegeneration/imagedata.json 2>/dev/null || true
          cat /usr/local/share/runner-images/image-info.json 2>/dev/null || true

      - name: Print rust/cargo/rustup diagnostics
        shell: bash
        run: |
          set -x

          command -v rustup || true
          command -v cargo || true
          command -v rustc || true

          which rustup || true
          which cargo || true
          which rustc || true

          ls -la "$(command -v rustup)" || true
          ls -la "$(command -v cargo)" || true
          ls -la "$(command -v rustc)" || true

          rustup --version || true
          rustup show || true
          cargo --version || true
          rustc --version -v || true

          echo "=== Homebrew rustup info ==="
          brew --prefix || true
          brew list --versions rustup || true
          brew info rustup || true
          brew linkage rustup || true

          echo "=== Rustup files ==="
          ls -la /opt/homebrew/bin/rustup /usr/local/bin/rustup 2>/dev/null || true
          ls -la /opt/homebrew/Cellar/rustup* /usr/local/Cellar/rustup* 2>/dev/null || true

      - name: Prepare minimal Rust workspace
        shell: bash
        run: |
          set -x

          mkdir -p repro-rust/chasquimq-node/src
          mkdir -p repro-rust/chasquimq/src

          cd repro-rust

          cat > Cargo.toml <<'EOF'
          [workspace]
          members = [
            "chasquimq",
            "chasquimq-node"
          ]

          [workspace.package]
          edition = "2021"
          license = "MIT"
          repository = "https://github.com/jotarios/chasquimq"
          rust-version = "1.82"
          EOF

          cat > chasquimq/Cargo.toml <<'EOF'
          [package]
          name = "chasquimq"
          version = "1.2.0"
          edition.workspace = true
          license.workspace = true
          repository.workspace = true
          rust-version.workspace = true
          publish = false

          [lib]
          path = "src/lib.rs"
          EOF

          cat > chasquimq/src/lib.rs <<'EOF'
          pub fn placeholder() {}
          EOF

          cat > chasquimq-node/Cargo.toml <<'EOF'
          [package]
          name = "chasquimq-node"
          version = "1.2.0"
          description = "Node.js NAPI-RS bindings for the chasquimq message broker."
          edition.workspace = true
          license.workspace = true
          repository.workspace = true
          rust-version.workspace = true
          publish = false

          [lib]
          crate-type = ["cdylib", "rlib"]

          [dependencies]
          napi = { version = "2", default-features = false, features = ["napi9", "async", "tokio_rt", "serde-json"] }
          napi-derive = "2"
          chasquimq = { path = "../chasquimq" }
          tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync"] }
          tokio-util = { version = "0.7", features = ["rt"] }
          serde = { version = "1", features = ["derive"] }
          serde_json = "1"
          bytes = "1"
          rmp-serde = "1"
          thiserror = "1"
          tracing = "0.1"

          [build-dependencies]
          napi-build = "2"

          [profile.release]
          lto = true
          codegen-units = 1
          EOF

          cat > chasquimq-node/src/lib.rs <<'EOF'
          pub fn placeholder() {}
          EOF

      - name: Direct repro A - rustup component add llvm-tools-preview
        id: direct_rustup
        continue-on-error: true
        shell: bash
        run: |
          set -x

          echo "=== Resolved rustup before direct repro ==="
          command -v rustup
          which rustup
          rustup --version

          rustup update --no-self-update stable
          rustup override set stable

          rustup component add llvm-tools-preview

      - name: Direct repro B - cargo metadata
        id: direct_cargo_metadata
        continue-on-error: true
        shell: bash
        run: |
          set -x

          echo "=== Resolved cargo before direct repro ==="
          command -v cargo
          which cargo
          cargo --version

          cargo metadata \
            --format-version 1 \
            --manifest-path "$GITHUB_WORKSPACE/repro-rust/chasquimq-node/Cargo.toml"

      - name: Action repro A - PyO3 maturin-action
        id: maturin_action
        continue-on-error: true
        uses: PyO3/maturin-action@v1
        with:
          command: build
          args: --manifest-path repro-rust/chasquimq-node/Cargo.toml --release
          target: ${{ runner.arch == 'ARM64' && 'aarch64-apple-darwin' || 'x86_64-apple-darwin' }}

      - name: Print diagnostics after maturin-action
        if: always()
        shell: bash
        run: |
          set -x

          echo "=== After maturin-action ==="
          command -v rustup || true
          command -v cargo || true
          command -v rustc || true

          which rustup || true
          which cargo || true
          which rustc || true

          rustup --version || true
          rustup show || true
          cargo --version || true
          rustc --version -v || true

          env | sort

      - name: Install Node.js
        if: always()
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Action-like repro B - napi-rs CLI calls cargo metadata
        id: napi_cli
        continue-on-error: true
        shell: bash
        working-directory: repro-rust/chasquimq-node
        run: |
          set -x

          echo "=== Resolved cargo before napi-rs repro ==="
          command -v cargo
          which cargo
          cargo --version

          echo "=== Resolved node/npm/npx ==="
          command -v node
          command -v npm
          command -v npx
          node --version
          npm --version

          # This path is closer to the real @napi-rs failure:
          # napi-rs CLI shells out to cargo metadata.
          npx --yes @napi-rs/cli --version

          # Try a command that forces napi-rs to inspect Cargo.toml.
          npx --yes @napi-rs/cli build \
            --platform \
            --release \
            --manifest-path "$GITHUB_WORKSPACE/repro-rust/chasquimq-node/Cargo.toml"

      - name: Final repro summary
        if: always()
        shell: bash
        run: |
          echo "## Repro summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Check | Result |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Direct rustup component add | ${{ steps.direct_rustup.outcome }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Direct cargo metadata | ${{ steps.direct_cargo_metadata.outcome }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| PyO3/maturin-action | ${{ steps.maturin_action.outcome }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| @napi-rs/cli build | ${{ steps.napi_cli.outcome }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "ImageOS: ${ImageOS:-}" >> "$GITHUB_STEP_SUMMARY"
          echo "ImageVersion: ${ImageVersion:-}" >> "$GITHUB_STEP_SUMMARY"
          echo "Runner arch: ${{ runner.arch }}" >> "$GITHUB_STEP_SUMMARY"
