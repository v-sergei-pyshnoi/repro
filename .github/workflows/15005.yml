name: Repro MongoDB service connection on Ubuntu x64

# https://github.com/actions/runner-images/issues/15005
# Compare pinned MongoDB versions on the same VM without changing rseq settings.
# Artifacts include raw evidence; the summary distinguishes a version gate from a crash.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repro:
    name: mongo:8 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-slim cannot run Docker service containers.
        os:
          - ubuntu-22.04
          - ubuntu-24.04
          - ubuntu-26.04
          - ubuntu-latest

    env:
      NODE_ENV: test

    services:
      # Match the issue: no additional health check, retries, or network workaround.
      mongo:
        image: mongo:8
        ports:
          - 27017:27017

    steps:
      - uses: actions/checkout@v4

      - name: Print runner and image information
        shell: bash
        env:
          MATRIX_OS: ${{ matrix.os }}
          RUNNER_ARCH: ${{ runner.arch }}
        run: |
          printf 'Runner label: %s\nArchitecture: %s\nImageOS: %s\nImageVersion: %s\n' \
            "$MATRIX_OS" "$RUNNER_ARCH" "${ImageOS:-unknown}" "${ImageVersion:-unknown}"
          cat /etc/os-release
          uname -a
          docker version
          docker info

      - uses: actions/setup-node@v4
        with:
          node-version: 24.15.0

      - name: Install official MongoDB Node driver
        shell: bash
        run: |
          node --version
          npm install --prefix "$RUNNER_TEMP/mongo-repro" \
            --no-audit --no-fund --ignore-scripts mongodb@6.21.0

      - name: Compare MongoDB versions and collect evidence
        shell: bash
        env:
          NODE_PATH: ${{ runner.temp }}/mongo-repro/node_modules
          MONGO_CONTAINER: ${{ job.services.mongo.id }}
          MATRIX_OS: ${{ matrix.os }}
          DIAGNOSTICS_DIR: ${{ runner.temp }}/mongo-diagnostics
        run: |
          node .github/scripts/15005-diagnostics.cjs

      - name: Collect service and network diagnostics
        if: always()
        shell: bash
        env:
          MONGO_CONTAINER: ${{ job.services.mongo.id }}
        run: |
          docker ps -a || true
          docker inspect "$MONGO_CONTAINER" || true
          docker port "$MONGO_CONTAINER" || true
          docker logs --timestamps "$MONGO_CONTAINER" || true
          docker exec "$MONGO_CONTAINER" mongosh --quiet \
            --eval 'db.adminCommand({ ping: 1 })' || true
          ss -lntp || true
          ip route || true
          sudo iptables -t nat -L -n -v || true

      - name: Upload diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mongo-15005-${{ matrix.os }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/mongo-diagnostics
          if-no-files-found: error
