name: Rustup and Cargo via Actions repro

on:
  workflow_dispatch:

jobs:
  repro:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS 15 ARM64
            os: macos-15
          - name: macOS 15 Intel
            os: macos-15-intel

    runs-on: ${{ matrix.os }}

    steps:
      - name: Print runner/image info
        shell: bash
        run: |
          set -x

          echo "runner.os=${{ runner.os }}"
          echo "runner.arch=${{ runner.arch }}"
          echo "matrix.os=${{ matrix.os }}"

          echo "ImageOS=${ImageOS:-}"
          echo "ImageVersion=${ImageVersion:-}"

          sw_vers
          uname -a
          arch

          echo "PATH=$PATH"

          echo "=== Runner image metadata ==="
          cat /imagegeneration/imagedata.json 2>/dev/null || true
          cat /usr/local/share/runner-images/image-info.json 2>/dev/null || true

      - name: Print initial Rust diagnostics
        shell: bash
        run: |
          set -x

          echo "=== Initial resolved tools ==="
          command -v rustup || true
          command -v cargo || true
          command -v rustc || true

          which rustup || true
          which cargo || true
          which rustc || true

          rustup --version || true
          rustup show || true
          cargo --version || true
          rustc --version -v || true

          echo "=== Homebrew rustup info ==="
          brew --prefix || true
          brew list --versions rustup || true
          brew info rustup || true

      - name: Prepare minimal Rust project
        shell: bash
        run: |
          set -x

          mkdir -p repro-rust/src

          cat > repro-rust/Cargo.toml <<'EOF'
          [package]
          name = "rustup-cargo-actions-repro"
          version = "0.1.0"
          edition = "2021"

          [dependencies]
          serde = { version = "1", features = ["derive"] }
          serde_json = "1"
          thiserror = "1"
          tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
          EOF

          cat > repro-rust/src/main.rs <<'EOF'
          fn main() {
              println!("hello from rustup-cargo-actions-repro");
          }
          EOF

          cat repro-rust/Cargo.toml
          cat repro-rust/src/main.rs

      - name: Print Rust diagnostics before rust-toolchain action
        shell: bash
        run: |
          set -x

          echo "=== Before dtolnay/rust-toolchain ==="
          command -v rustup || true
          command -v cargo || true
          command -v rustc || true

          which rustup || true
          which cargo || true
          which rustc || true

          rustup --version || true
          rustup show || true
          cargo --version || true
          rustc --version -v || true

      - name: Action repro A - install stable toolchain with llvm-tools-preview
        id: rust_toolchain_action
        continue-on-error: true
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: llvm-tools-preview

      - name: Print Rust diagnostics after rust-toolchain action
        if: always()
        shell: bash
        run: |
          set -x

          echo "=== After dtolnay/rust-toolchain ==="
          command -v rustup || true
          command -v cargo || true
          command -v rustc || true

          which rustup || true
          which cargo || true
          which rustc || true

          rustup --version || true
          rustup show || true
          cargo --version || true
          rustc --version -v || true

      - name: Action repro B - cargo metadata through actions-rs/cargo
        id: cargo_metadata_action
        continue-on-error: true
        uses: actions-rs/cargo@v1
        with:
          command: metadata
          args: --format-version 1 --manifest-path repro-rust/Cargo.toml

      - name: Direct comparison - rustup component add
        id: direct_rustup
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set -x

          echo "=== Direct rustup comparison ==="
          command -v rustup || true
          which rustup || true
          rustup --version || true

          rustup component add llvm-tools-preview

      - name: Direct comparison - cargo metadata
        id: direct_cargo_metadata
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set -x

          echo "=== Direct cargo comparison ==="
          command -v cargo || true
          which cargo || true
          cargo --version || true

          cargo metadata \
            --format-version 1 \
            --manifest-path repro-rust/Cargo.toml

      - name: Final summary
        if: always()
        shell: bash
        run: |
          echo "## Rustup/Cargo Actions repro summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          echo "| Check | Result |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| dtolnay/rust-toolchain with llvm-tools-preview | ${{ steps.rust_toolchain_action.outcome }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| actions-rs/cargo metadata | ${{ steps.cargo_metadata_action.outcome }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| direct rustup component add | ${{ steps.direct_rustup.outcome }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| direct cargo metadata | ${{ steps.direct_cargo_metadata.outcome }} |" >> "$GITHUB_STEP_SUMMARY"

          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "ImageOS: ${ImageOS:-}" >> "$GITHUB_STEP_SUMMARY"
          echo "ImageVersion: ${ImageVersion:-}" >> "$GITHUB_STEP_SUMMARY"
          echo "Runner arch: ${{ runner.arch }}" >> "$GITHUB_STEP_SUMMARY"
