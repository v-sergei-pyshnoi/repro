name: Rustup macOS 15 repro

on:
  workflow_dispatch:

jobs:
  repro:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS 15 ARM64
            os: macos-15
          - name: macOS 15 Intel
            os: macos-15-intel

    runs-on: ${{ matrix.os }}

    steps:
      - name: Print runner/image info
        shell: bash
        run: |
          set -x

          echo "runner.os=${{ runner.os }}"
          echo "runner.arch=${{ runner.arch }}"
          echo "matrix.os=${{ matrix.os }}"

          echo "ImageOS=${ImageOS:-}"
          echo "ImageVersion=${ImageVersion:-}"

          sw_vers
          uname -a
          arch

          echo "PATH=$PATH"

          echo "=== Runner image metadata ==="
          cat /imagegeneration/imagedata.json 2>/dev/null || true
          cat /usr/local/share/runner-images/image-info.json 2>/dev/null || true

      - name: Print rust/cargo/rustup diagnostics
        shell: bash
        run: |
          set -x

          command -v rustup || true
          command -v cargo || true
          command -v rustc || true

          ls -la "$(command -v rustup)" || true
          ls -la "$(command -v cargo)" || true
          ls -la "$(command -v rustc)" || true

          rustup --version || true
          rustup show || true
          cargo --version || true
          rustc --version -v || true

          echo "=== Homebrew rustup info ==="
          brew --prefix || true
          brew list --versions rustup || true
          brew info rustup || true
          brew linkage rustup || true

          echo "=== Rustup files ==="
          ls -la /opt/homebrew/bin/rustup /usr/local/bin/rustup 2>/dev/null || true
          ls -la /opt/homebrew/Cellar/rustup* /usr/local/Cellar/rustup* 2>/dev/null || true

      - name: Repro A - rustup component add llvm-tools-preview
        shell: bash
        run: |
          set -x

          /opt/homebrew/bin/rustup update --no-self-update stable
          /opt/homebrew/bin/rustup override set stable

          # This is the reported failing path:
          # Error: unexpected argument '+stable' found
          /opt/homebrew/bin/rustup component add llvm-tools-preview

      - name: Repro B - cargo metadata
        shell: bash
        run: |
          set -x

          mkdir -p repro-rust/chasquimq-node/src
          mkdir -p repro-rust/chasquimq/src

          cd repro-rust

          cat > Cargo.toml <<'EOF'
          [workspace]
          members = [
            "chasquimq",
            "chasquimq-node"
          ]

          [workspace.package]
          edition = "2021"
          license = "MIT"
          repository = "https://github.com/jotarios/chasquimq"
          rust-version = "1.82"
          EOF

          cat > chasquimq/Cargo.toml <<'EOF'
          [package]
          name = "chasquimq"
          version = "1.2.0"
          edition.workspace = true
          license.workspace = true
          repository.workspace = true
          rust-version.workspace = true
          publish = false

          [lib]
          path = "src/lib.rs"
          EOF

          cat > chasquimq/src/lib.rs <<'EOF'
          pub fn placeholder() {}
          EOF

          cat > chasquimq-node/Cargo.toml <<'EOF'
          [package]
          name = "chasquimq-node"
          version = "1.2.0"
          description = "Node.js NAPI-RS bindings for the chasquimq message broker."
          edition.workspace = true
          license.workspace = true
          repository.workspace = true
          rust-version.workspace = true
          publish = false

          [lib]
          crate-type = ["cdylib", "rlib"]

          [dependencies]
          napi = { version = "2", default-features = false, features = ["napi9", "async", "tokio_rt", "serde-json"] }
          napi-derive = "2"
          chasquimq = { path = "../chasquimq" }
          tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync"] }
          tokio-util = { version = "0.7", features = ["rt"] }
          serde = { version = "1", features = ["derive"] }
          serde_json = "1"
          bytes = "1"
          rmp-serde = "1"
          thiserror = "1"
          tracing = "0.1"

          [build-dependencies]
          napi-build = "2"

          [profile.release]
          lto = true
          codegen-units = 1
          EOF

          cat > chasquimq-node/src/lib.rs <<'EOF'
          pub fn placeholder() {}
          EOF

          # This is the second reported failing path:
          # error: unexpected argument 'metadata' found
          cargo metadata \
            --format-version 1 \
            --manifest-path "$(pwd)/chasquimq-node/Cargo.toml"
