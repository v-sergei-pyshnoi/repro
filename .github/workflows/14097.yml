name: Repro rust-toolchain on macOS

on:
  workflow_dispatch:

jobs:
  repro:
    name: dtolnay/rust-toolchain / ${{ matrix.os }} / run ${{ matrix.run }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-15
          - macos-26
          - macos-15-intel
          - macos-26-intel

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v5

      - name: Print runner/image info
        shell: bash
        run: |
          set -x

          echo "Matrix OS: ${{ matrix.os }}"
          echo "Matrix run: ${{ matrix.run }}"
          echo "Runner OS: ${{ runner.os }}"
          echo "Runner arch: ${{ runner.arch }}"
          echo "ImageOS=${ImageOS:-}"
          echo "ImageVersion=${ImageVersion:-}"

          sw_vers
          uname -a
          arch

      - name: Create minimal Cargo project
        shell: bash
        run: |
          set -x

          cat > Cargo.toml <<'EOF'
          [package]
          name = "rust-toolchain-macos-repro"
          version = "0.1.0"
          edition = "2021"

          [dependencies]
          EOF

          mkdir -p src

          cat > src/lib.rs <<'EOF'
          pub fn add(left: u64, right: u64) -> u64 {
              left + right
          }

          #[cfg(test)]
          mod tests {
              use super::*;

              #[test]
              fn it_works() {
                  assert_eq!(add(2, 2), 4);
              }
          }
          EOF

          cat > src/main.rs <<'EOF'
          fn main() {
              println!("hello from rust-toolchain-macos-repro");
          }
          EOF

          cargo generate-lockfile

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@v2

      - run: cargo build --locked --all-targets
