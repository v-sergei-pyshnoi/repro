name: Windows ARM scheduled tasks

on:
  workflow_dispatch:

permissions: {}

jobs:
  collect:
    name: Collect / ${{ matrix.label }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: windows-11-arm
            runner: windows-11-arm
          - label: windows-11-vs2026-arm
            runner: windows-11-vs2026-arm

    steps:
      - name: Collect scheduled tasks
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $reportDir = Join-Path $env:RUNNER_TEMP 'windows-arm-scheduled-tasks'
          New-Item -ItemType Directory -Path $reportDir -Force | Out-Null

          function Convert-ToMarkdownTable {
            param(
              [Parameter(Mandatory = $true)]
              [array]$Rows,
              [Parameter(Mandatory = $true)]
              [string[]]$Columns
            )

            if (-not $Rows -or $Rows.Count -eq 0) {
              $header = '| ' + ($Columns -join ' | ') + ' |'
              $separator = '| ' + (($Columns | ForEach-Object { '---' }) -join ' | ') + ' |'
              $empty = '| ' + (($Columns | ForEach-Object { if ($_ -eq $Columns[0]) { 'No data' } else { '' } }) -join ' | ') + ' |'
              return @($header, $separator, $empty)
            }

            $header = '| ' + (($Columns | ForEach-Object { $_ -replace '\|', '\\|' }) -join ' | ') + ' |'
            $separator = '| ' + (($Columns | ForEach-Object { '---' }) -join ' | ') + ' |'
            $lines = @($header, $separator)

            foreach ($row in $Rows) {
              $cells = foreach ($column in $Columns) {
                $value = $row.$column
                if ($null -eq $value) {
                  ''
                } else {
                  ([string]$value) -replace '\|', '\\|'
                }
              }
              $lines += '| ' + ($cells -join ' | ') + ' |'
            }

            return $lines
          }

          function Format-DateTime {
            param(
              [Nullable[datetime]]$Value
            )

            if ($null -eq $Value -or $Value -eq [datetime]::MinValue) {
              return ''
            }

            return $Value.ToString('s')
          }

          function Get-TriggerSummary {
            param(
              [AllowNull()]
              [object[]]$Triggers
            )

            if (-not $Triggers) {
              return ''
            }

            $parts = foreach ($trigger in $Triggers) {
              if ($null -eq $trigger) {
                continue
              }

              $type = if ($trigger.CimClass -and $trigger.CimClass.CimClassName) {
                $trigger.CimClass.CimClassName -replace '^MSFT_Task', '' -replace 'Trigger$', ''
              } else {
                $trigger.GetType().Name
              }

              $startBoundary = if ($trigger.PSObject.Properties.Name -contains 'StartBoundary' -and $trigger.StartBoundary) {
                try {
                  ([datetime]$trigger.StartBoundary).ToString('s')
                } catch {
                  [string]$trigger.StartBoundary
                }
              } else {
                ''
              }

              if ($startBoundary) {
                '{0} ({1})' -f $type, $startBoundary
              } else {
                $type
              }
            }

            return ($parts -join '; ')
          }

          function Test-IsTaskScheduled {
            param(
              [Parameter(Mandatory = $true)]
              [bool]$Enabled,
              [Parameter(Mandatory = $true)]
              [string]$State,
              [Nullable[datetime]]$NextRunTime
            )

            return $Enabled -or $State -in @('Running', 'Ready', 'Queued') -or ($NextRunTime -and $NextRunTime -ne [datetime]::MinValue)
          }

          $runnerLabel = '${{ matrix.label }}'
          $tasks = @(Get-ScheduledTask)
          $rows = New-Object System.Collections.Generic.List[object]

          foreach ($task in $tasks) {
            $taskInfo = $null
            try {
              $taskInfo = Get-ScheduledTaskInfo -TaskName $task.TaskName -TaskPath $task.TaskPath -ErrorAction Stop
            } catch {
            }

            $state = [string]$task.State
            $enabled = [bool]$task.Settings.Enabled
            $nextRunTime = if ($taskInfo) { $taskInfo.NextRunTime } else { $null }
            $lastRunTime = if ($taskInfo) { $taskInfo.LastRunTime } else { $null }
            $lastTaskResult = if ($taskInfo) { $taskInfo.LastTaskResult } else { $null }
            $triggerSummary = Get-TriggerSummary -Triggers $task.Triggers

            $isScheduled = Test-IsTaskScheduled -Enabled $enabled -State $state -NextRunTime $nextRunTime
            if (-not $isScheduled) {
              continue
            }

            $rows.Add([pscustomobject]@{
              runner_label    = $runnerLabel
              image_os        = $env:ImageOS
              image_version   = $env:ImageVersion
              task_path       = $task.TaskPath
              task_name       = $task.TaskName
              task_state      = $state
              enabled         = $enabled
              next_run_time   = Format-DateTime -Value $nextRunTime
              last_run_time   = Format-DateTime -Value $lastRunTime
              last_task_result = $lastTaskResult
              author          = $task.Author
              description     = $task.Description
              triggers        = $triggerSummary
            })
          }

          $allRows = @($rows | Sort-Object task_state, task_path, task_name)
          $stateRows = @($allRows | Group-Object task_state | Sort-Object Name | ForEach-Object {
            [pscustomobject]@{
              State = $_.Name
              Count = $_.Count
            }
          })

          $tasksCsv = Join-Path $reportDir 'scheduled-tasks.csv'
          $tasksJson = Join-Path $reportDir 'scheduled-tasks.json'
          $summaryPath = Join-Path $reportDir 'summary.md'
          $systemInfoPath = Join-Path $reportDir 'system-info.txt'

          $allRows | Export-Csv -Path $tasksCsv -NoTypeInformation -Encoding UTF8
          $allRows | ConvertTo-Json -Depth 6 | Set-Content -Path $tasksJson -Encoding UTF8

          @(
            "runner_label=$runnerLabel"
            "image_os=$env:ImageOS"
            "image_version=$env:ImageVersion"
            "computer_name=$env:COMPUTERNAME"
            "scheduled_task_count=$($allRows.Count)"
          ) | Set-Content -Path $systemInfoPath -Encoding UTF8

          $summaryLines = @()
          $summaryLines += "# $runnerLabel"
          $summaryLines += ''
          $summaryLines += "* Image OS: $env:ImageOS"
          $summaryLines += "* Image Version: $env:ImageVersion"
          $summaryLines += "* Active/scheduled tasks found: $($allRows.Count)"
          $summaryLines += ''
          $summaryLines += '## Task states'
          $summaryLines += ''
          $summaryLines += Convert-ToMarkdownTable -Rows $stateRows -Columns @('State', 'Count')
          $summaryLines += ''
          $summaryLines += '## Tasks'
          $summaryLines += ''
          $summaryLines += Convert-ToMarkdownTable -Rows ($allRows | ForEach-Object {
            [pscustomobject]@{
              State = $_.task_state
              Enabled = $_.enabled
              'Next run' = $_.next_run_time
              'Last run' = $_.last_run_time
              'Task path' = $_.task_path
              'Task name' = $_.task_name
              Triggers = $_.triggers
            }
          }) -Columns @('State', 'Enabled', 'Next run', 'Last run', 'Task path', 'Task name', 'Triggers')

          $summaryLines | Set-Content -Path $summaryPath -Encoding UTF8
          Get-Content -Path $summaryPath | Add-Content -Path $env:GITHUB_STEP_SUMMARY

      - name: Investigate WSL (issue 14264)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $reportDir = Join-Path $env:RUNNER_TEMP 'windows-arm-scheduled-tasks'
          $runnerLabel = '${{ matrix.label }}'

          # ── 1. WSL version / status ──────────────────────────────────────────
          $wslInfo = [ordered]@{}

          $wslExe = (Get-Command wsl.exe -ErrorAction SilentlyContinue)?.Source
          $wslInfo['wsl_exe_path'] = if ($wslExe) { $wslExe } else { 'NOT FOUND' }

          foreach ($cmd in @('--version', '--status')) {
            $key = 'wsl_' + ($cmd -replace '-', '')
            try {
              $out = & wsl.exe $cmd 2>&1
              $wslInfo[$key] = ($out -join "`n").Trim()
            } catch {
              $wslInfo[$key] = "ERROR: $_"
            }
          }

          try {
            $out = & wsl.exe --list --verbose 2>&1
            $wslInfo['wsl_list_verbose'] = ($out -join "`n").Trim()
          } catch {
            $wslInfo['wsl_list_verbose'] = "ERROR: $_"
          }

          # ── 2. ALL scheduled tasks whose path or name contains WSL ───────────
          $wslTasks = @(Get-ScheduledTask | Where-Object {
            $_.TaskPath -imatch 'WSL|WindowsSubsystemForLinux' -or
            $_.TaskName -imatch 'WSL'
          })

          $wslTaskRows = @(foreach ($t in $wslTasks) {
            $info = $null
            try { $info = Get-ScheduledTaskInfo -TaskName $t.TaskName -TaskPath $t.TaskPath -ErrorAction SilentlyContinue } catch {}
            $actions = ($t.Actions | ForEach-Object {
              if ($_.Execute) { "$($_.Execute) $($_.Arguments)".Trim() } else { [string]$_ }
            }) -join '; '
            [pscustomobject]@{
              runner_label     = $runnerLabel
              task_path        = $t.TaskPath
              task_name        = $t.TaskName
              state            = [string]$t.State
              enabled          = [bool]$t.Settings.Enabled
              run_on_demand    = [bool]$t.Settings.AllowDemandStart
              actions          = $actions
              author           = $t.Author
              description      = $t.Description
              next_run_time    = if ($info) { [string]$info.NextRunTime } else { '' }
              last_run_time    = if ($info) { [string]$info.LastRunTime } else { '' }
              last_task_result = if ($info) { [string]$info.LastTaskResult } else { '' }
            }
          })

          # ── 3. Registry startup / Run keys that mention wsl ──────────────────
          $runKeyPaths = @(
            'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Run',
            'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\RunOnce',
            'HKCU:\SOFTWARE\Microsoft\Windows\CurrentVersion\Run',
            'HKCU:\SOFTWARE\Microsoft\Windows\CurrentVersion\RunOnce',
            'HKLM:\SOFTWARE\WOW6432Node\Microsoft\Windows\CurrentVersion\Run',
            'HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Winlogon'
          )

          $regRows = @(foreach ($keyPath in $runKeyPaths) {
            if (-not (Test-Path $keyPath)) { continue }
            $key = Get-Item -LiteralPath $keyPath -ErrorAction SilentlyContinue
            if (-not $key) { continue }
            foreach ($valueName in $key.GetValueNames()) {
              $data = [string]$key.GetValue($valueName)
              if ($data -imatch 'wsl' -or $valueName -imatch 'wsl') {
                [pscustomobject]@{
                  runner_label = $runnerLabel
                  key_path     = $keyPath
                  value_name   = $valueName
                  data         = $data
                }
              }
            }
          })

          # ── 4. Dump all Run-key entries (for completeness) ───────────────────
          $allRunRows = @(foreach ($keyPath in $runKeyPaths) {
            if (-not (Test-Path $keyPath)) { continue }
            $key = Get-Item -LiteralPath $keyPath -ErrorAction SilentlyContinue
            if (-not $key) { continue }
            foreach ($valueName in $key.GetValueNames()) {
              [pscustomobject]@{
                key_path   = $keyPath
                value_name = $valueName
                data       = [string]$key.GetValue($valueName)
              }
            }
          })

          # ── 5. Write artifacts ───────────────────────────────────────────────
          $wslInfo | ConvertTo-Json -Depth 4 | Set-Content (Join-Path $reportDir 'wsl-info.json') -Encoding UTF8
          $wslTaskRows | Export-Csv (Join-Path $reportDir 'wsl-tasks.csv') -NoTypeInformation -Encoding UTF8
          $wslTaskRows | ConvertTo-Json -Depth 6 | Set-Content (Join-Path $reportDir 'wsl-tasks.json') -Encoding UTF8
          $regRows    | Export-Csv (Join-Path $reportDir 'wsl-registry-run.csv') -NoTypeInformation -Encoding UTF8
          $allRunRows | Export-Csv (Join-Path $reportDir 'all-registry-run.csv') -NoTypeInformation -Encoding UTF8

          # ── 6. Append WSL section to step summary ────────────────────────────
          $lines = @()
          $lines += ''
          $lines += '## WSL investigation (issue #14264)'
          $lines += ''
          $lines += '### WSL executable info'
          $lines += ''
          $lines += '```'
          $lines += "wsl.exe path : $($wslInfo['wsl_exe_path'])"
          $lines += '```'
          $lines += ''
          $lines += '### WSL --version'
          $lines += ''
          $lines += '```'
          $lines += $wslInfo['wsl_version']
          $lines += '```'
          $lines += ''
          $lines += '### WSL --status'
          $lines += ''
          $lines += '```'
          $lines += $wslInfo['wsl_status']
          $lines += '```'
          $lines += ''

          $lines += '### WSL-related scheduled tasks (all states)'
          $lines += ''
          if ($wslTaskRows -and @($wslTaskRows).Count -gt 0) {
            $header = '| State | Enabled | Task path | Task name | Actions | Next run | Last run |'
            $sep    = '| --- | --- | --- | --- | --- | --- | --- |'
            $lines += $header
            $lines += $sep
            foreach ($r in @($wslTaskRows)) {
              $cells = @(
                [string]$r.state,
                [string]$r.enabled,
                [string]$r.task_path  -replace '\|','\\|',
                [string]$r.task_name  -replace '\|','\\|',
                [string]$r.actions    -replace '\|','\\|',
                [string]$r.next_run_time,
                [string]$r.last_run_time
              )
              $lines += '| ' + ($cells -join ' | ') + ' |'
            }
          } else {
            $lines += '_No WSL-related scheduled tasks found._'
          }
          $lines += ''

          $lines += '### WSL-related registry Run/RunOnce entries'
          $lines += ''
          if ($regRows -and @($regRows).Count -gt 0) {
            $lines += '| Key path | Value name | Data |'
            $lines += '| --- | --- | --- |'
            foreach ($r in @($regRows)) {
              $cells = @(
                [string]$r.key_path   -replace '\|','\\|',
                [string]$r.value_name -replace '\|','\\|',
                [string]$r.data       -replace '\|','\\|'
              )
              $lines += '| ' + ($cells -join ' | ') + ' |'
            }
          } else {
            $lines += '_No WSL-related registry Run entries found._'
          }
          $lines += ''

          $lines | Add-Content -Path $env:GITHUB_STEP_SUMMARY

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-arm-scheduled-tasks-${{ matrix.label }}
          path: ${{ runner.temp }}/windows-arm-scheduled-tasks

  summarize:
    name: Summarize all Windows ARM images
    runs-on: ubuntu-latest
    needs: collect

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: windows-arm-scheduled-tasks-*
          path: artifacts

      - name: Build combined summary
        shell: bash
        run: |
          python <<'PY'
          import csv
          import json
          import os
          import pathlib

          root = pathlib.Path("artifacts")
          out_dir = pathlib.Path("combined-report")
          out_dir.mkdir(exist_ok=True)

          rows = []
          for csv_path in root.glob("**/scheduled-tasks.csv"):
              with csv_path.open(newline="", encoding="utf-8") as handle:
                  rows.extend(list(csv.DictReader(handle)))

          rows.sort(key=lambda row: (row["runner_label"], row["task_state"], row["task_path"], row["task_name"]))

          # WSL task rows
          wsl_task_rows = []
          for csv_path in root.glob("**/wsl-tasks.csv"):
              with csv_path.open(newline="", encoding="utf-8") as handle:
                  wsl_task_rows.extend(list(csv.DictReader(handle)))

          wsl_task_rows.sort(key=lambda r: (r.get("runner_label", ""), r.get("task_path", ""), r.get("task_name", "")))

          # WSL registry rows
          wsl_reg_rows = []
          for csv_path in root.glob("**/wsl-registry-run.csv"):
              with csv_path.open(newline="", encoding="utf-8") as handle:
                  wsl_reg_rows.extend(list(csv.DictReader(handle)))

          # WSL info blobs (per runner)
          wsl_info_by_runner = {}
          for info_path in root.glob("**/wsl-info.json"):
              runner_dir = info_path.parent.parent.name  # runner label from artifact download path
              try:
                  wsl_info_by_runner[runner_dir] = json.loads(info_path.read_text(encoding="utf-8"))
              except Exception:
                  pass

          def markdown_table(items, columns):
              if not items:
                  return [
                      "| " + " | ".join(columns) + " |",
                      "| " + " | ".join(["---"] * len(columns)) + " |",
                      "| " + " | ".join(["No data"] + [""] * (len(columns) - 1)) + " |",
                  ]

              lines = [
                  "| " + " | ".join(columns) + " |",
                  "| " + " | ".join(["---"] * len(columns)) + " |",
              ]
              for item in items:
                  cells = [str(item.get(column, "")).replace("|", "\\|") for column in columns]
                  lines.append("| " + " | ".join(cells) + " |")
              return lines

          summary_lines = ["# Windows ARM scheduled tasks", ""]

          runner_order = []
          for row in rows:
              if row["runner_label"] not in runner_order:
                  runner_order.append(row["runner_label"])

          for runner in runner_order:
              runner_rows = [row for row in rows if row["runner_label"] == runner]
              summary_lines.append(f"## {runner}")
              summary_lines.append("")
              if runner_rows:
                  summary_lines.append(f"* Image OS: {runner_rows[0].get('image_os', '')}")
                  summary_lines.append(f"* Image Version: {runner_rows[0].get('image_version', '')}")
                  summary_lines.append(f"* Active/scheduled tasks found: {len(runner_rows)}")
                  summary_lines.append("")

              state_counts = {}
              for row in runner_rows:
                  state_counts[row["task_state"]] = state_counts.get(row["task_state"], 0) + 1

              summary_lines.extend(
                  markdown_table(
                      [{"State": state, "Count": count} for state, count in sorted(state_counts.items())],
                      ["State", "Count"],
                  )
              )
              summary_lines.append("")
              summary_lines.extend(
                  markdown_table(
                      [
                          {
                              "State": row["task_state"],
                              "Enabled": row["enabled"],
                              "Next run": row["next_run_time"],
                              "Last run": row["last_run_time"],
                              "Task path": row["task_path"],
                              "Task name": row["task_name"],
                              "Triggers": row["triggers"],
                          }
                          for row in runner_rows
                      ],
                      ["State", "Enabled", "Next run", "Last run", "Task path", "Task name", "Triggers"],
                  )
              )
              summary_lines.append("")

          # ── WSL investigation section (issue #14264) ──────────────────────────
          summary_lines.append("# WSL investigation (issue #14264)")
          summary_lines.append("")

          if wsl_info_by_runner:
              summary_lines.append("## WSL version / status per runner")
              summary_lines.append("")
              for runner_dir, info in sorted(wsl_info_by_runner.items()):
                  summary_lines.append(f"### {runner_dir}")
                  summary_lines.append("")
                  summary_lines.append("```")
                  summary_lines.append(f"wsl.exe path : {info.get('wsl_exe_path', 'N/A')}")
                  summary_lines.append("--- wsl --version ---")
                  summary_lines.append(info.get("wsl_version", ""))
                  summary_lines.append("--- wsl --status ---")
                  summary_lines.append(info.get("wsl_status", ""))
                  summary_lines.append("```")
                  summary_lines.append("")

          summary_lines.append("## WSL-related scheduled tasks (all states, all runners)")
          summary_lines.append("")
          summary_lines.extend(
              markdown_table(
                  [
                      {
                          "Runner": r.get("runner_label", ""),
                          "State": r.get("state", ""),
                          "Enabled": r.get("enabled", ""),
                          "Task path": r.get("task_path", ""),
                          "Task name": r.get("task_name", ""),
                          "Actions": r.get("actions", ""),
                          "Next run": r.get("next_run_time", ""),
                      }
                      for r in wsl_task_rows
                  ],
                  ["Runner", "State", "Enabled", "Task path", "Task name", "Actions", "Next run"],
              )
          )
          summary_lines.append("")

          summary_lines.append("## WSL-related registry Run/RunOnce entries (all runners)")
          summary_lines.append("")
          summary_lines.extend(
              markdown_table(
                  [
                      {
                          "Runner": r.get("runner_label", ""),
                          "Key path": r.get("key_path", ""),
                          "Value name": r.get("value_name", ""),
                          "Data": r.get("data", ""),
                      }
                      for r in wsl_reg_rows
                  ],
                  ["Runner", "Key path", "Value name", "Data"],
              )
          )
          summary_lines.append("")

          with (out_dir / "scheduled-tasks.csv").open("w", newline="", encoding="utf-8") as handle:
              writer = csv.DictWriter(
                  handle,
                  fieldnames=[
                      "runner_label",
                      "image_os",
                      "image_version",
                      "task_path",
                      "task_name",
                      "task_state",
                      "enabled",
                      "next_run_time",
                      "last_run_time",
                      "last_task_result",
                      "author",
                      "description",
                      "triggers",
                  ],
              )
              writer.writeheader()
              writer.writerows(rows)

          if wsl_task_rows:
              with (out_dir / "wsl-tasks-combined.csv").open("w", newline="", encoding="utf-8") as handle:
                  writer = csv.DictWriter(
                      handle,
                      fieldnames=["runner_label", "task_path", "task_name", "state", "enabled",
                                  "run_on_demand", "actions", "author", "description",
                                  "next_run_time", "last_run_time", "last_task_result"],
                  )
                  writer.writeheader()
                  writer.writerows(wsl_task_rows)

          if wsl_reg_rows:
              with (out_dir / "wsl-registry-combined.csv").open("w", newline="", encoding="utf-8") as handle:
                  writer = csv.DictWriter(handle, fieldnames=["runner_label", "key_path", "value_name", "data"])
                  writer.writeheader()
                  writer.writerows(wsl_reg_rows)

          summary_text = "\n".join(summary_lines) + "\n"
          (out_dir / "summary.md").write_text(summary_text, encoding="utf-8")

          print(summary_text)
          with pathlib.Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a", encoding="utf-8") as handle:
              handle.write(summary_text)
          PY

      - name: Upload combined artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-arm-scheduled-tasks-combined
          path: combined-report
