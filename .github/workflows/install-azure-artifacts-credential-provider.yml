name: Install Azure Artifacts Credential Provider

on:
  workflow_dispatch:

permissions: {}

jobs:
  install-and-verify:
    runs-on: ubuntu-latest

    steps:
      - name: Install Azure Artifacts Credential Provider
        shell: bash
        run: |
          set -euxo pipefail
          INSTALL_SCRIPT="/tmp/install-artifacts-credprovider.sh"
          curl -fsSL --proto '=https' --tlsv1.2 https://aka.ms/install-artifacts-credprovider.sh -o "$INSTALL_SCRIPT"
          test -s "$INSTALL_SCRIPT" || { echo "Install script download failed: $INSTALL_SCRIPT"; exit 1; }
          bash "$INSTALL_SCRIPT"

      - name: Verify Azure Artifacts Credential Provider installation
        shell: bash
        run: |
          set -euxo pipefail

          PLUGIN_ROOT="$HOME/.nuget/plugins"
          PROVIDER_DIR="$PLUGIN_ROOT/netcore/CredentialProvider.Microsoft"

          test -d "$PROVIDER_DIR" || { echo "Provider directory was not found: $PROVIDER_DIR"; exit 1; }
          test -f "$PROVIDER_DIR/CredentialProvider.Microsoft.dll" || { echo "CredentialProvider.Microsoft.dll was not found in: $PROVIDER_DIR"; exit 1; }

          echo "Installed provider files:"
          find "$PROVIDER_DIR" -maxdepth 1 -type f | sort
          FILE_COUNT="$(find "$PROVIDER_DIR" -maxdepth 1 -type f | wc -l)"
          test "$FILE_COUNT" -gt 0 || { echo "No files were found in provider directory: $PROVIDER_DIR"; exit 1; }
