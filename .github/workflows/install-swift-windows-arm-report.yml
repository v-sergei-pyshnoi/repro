name: Install Swift on Windows 11 ARM

on:
  workflow_dispatch:

permissions: {}

jobs:
  install-swift:
    name: Install Swift and measure disk usage
    runs-on: windows-11-arm
    env:
      SWIFT_SEARCH_DEPTH: '6'
      SWIFT_INSTALLER_URL: 'https://download.swift.org/swift-6.3.3-release/windows10-arm64/swift-6.3.3-RELEASE/swift-6.3.3-RELEASE-windows10-arm64.exe'
      # Keep this in sync with SWIFT_INSTALLER_URL whenever Swift version is updated.
      SWIFT_INSTALLER_EXPECTED_BYTES: '1363698552'
      # Swift installers on Windows can use Program Files or C:\Library\Developer\Toolchains layout.
      SWIFT_ROOTS_JSON: '["C:\\Program Files\\Swift","C:\\Library\\Developer\\Toolchains","%USERPROFILE%\\AppData\\Local\\Programs\\Swift"]'

    steps:
      - name: Capture disk state before installation
        id: before
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $drive = Get-PSDrive -Name C
          "pre_used_bytes=$([int64]$drive.Used)" >> $env:GITHUB_OUTPUT
          "pre_free_bytes=$([int64]$drive.Free)" >> $env:GITHUB_OUTPUT
          "pre_total_bytes=$([int64]($drive.Used + $drive.Free))" >> $env:GITHUB_OUTPUT

      - name: Install Swift via direct .exe installer
        id: install
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installerUrl = $env:SWIFT_INSTALLER_URL
          $installerFileName = [System.IO.Path]::GetFileName($installerUrl)
          $installerPath = Join-Path $env:RUNNER_TEMP $installerFileName
          $downloadTimeoutSec = 1800
          $downloadRetryCount = 3

          Write-Host "Downloading Swift installer: $installerUrl"
          try {
            $headResponse = Invoke-WebRequest -Uri $installerUrl -Method Head -TimeoutSec $downloadTimeoutSec -ErrorAction Stop
            $downloaded = $false
            $previousNativeCommandPreference = $PSNativeCommandUseErrorActionPreference
            try {
              $PSNativeCommandUseErrorActionPreference = $false
              for ($attempt = 1; $attempt -le $downloadRetryCount; $attempt++) {
                if (Test-Path -LiteralPath $installerPath) {
                  Remove-Item -LiteralPath $installerPath -Force -ErrorAction SilentlyContinue
                }

                Write-Host "Download attempt $attempt of $downloadRetryCount"
                & curl.exe --fail --location --silent --show-error --output $installerPath --connect-timeout 30 --max-time $downloadTimeoutSec $installerUrl
                if ($LASTEXITCODE -eq 0 -and (Test-Path -LiteralPath $installerPath)) {
                  $downloaded = $true
                  break
                }

                if ($attempt -lt $downloadRetryCount) {
                  Start-Sleep -Seconds (5 * $attempt)
                }
              }
            } finally {
              $PSNativeCommandUseErrorActionPreference = $previousNativeCommandPreference
            }

            if (-not $downloaded) {
              throw "curl.exe failed to download the installer after $downloadRetryCount attempts."
            }
          } catch {
            throw "Failed to download Swift installer from $installerUrl. Error: $($_.Exception.Message)"
          }

          if (-not (Test-Path -LiteralPath $installerPath)) {
            throw "Swift installer was not downloaded: $installerPath"
          }

          $downloadedInstallerSizeBytes = [int64](Get-Item -LiteralPath $installerPath).Length
          $expectedInstallerSizeBytes = [int64]$env:SWIFT_INSTALLER_EXPECTED_BYTES
          if ($expectedInstallerSizeBytes -gt 0 -and $downloadedInstallerSizeBytes -ne $expectedInstallerSizeBytes) {
            throw "Downloaded installer size mismatch. Expected: $expectedInstallerSizeBytes bytes. Actual: $downloadedInstallerSizeBytes bytes."
          }

          $headerContentLength = [string]$headResponse.Headers['Content-Length']
          if ($headerContentLength) {
            $responseContentLength = [int64]$headerContentLength
            if ($responseContentLength -ne $downloadedInstallerSizeBytes) {
              throw "Downloaded installer size does not match HTTP Content-Length. Header: $responseContentLength bytes. Actual: $downloadedInstallerSizeBytes bytes."
            }
          }

          $signature = Get-AuthenticodeSignature -FilePath $installerPath
          if ($signature.Status -ne 'Valid') {
            throw "Installer signature is not valid. Status: $($signature.Status)"
          }
          if (-not $signature.SignerCertificate -or -not $signature.SignerCertificate.Subject.Contains('O=Apple Inc.')) {
            throw "Installer signer is unexpected: $($signature.SignerCertificate.Subject)"
          }

          $installStart = Get-Date
          $installProcess = Start-Process -FilePath $installerPath -ArgumentList '/quiet','/norestart' -Wait -PassThru
          $installEnd = Get-Date
          if ($installProcess.ExitCode -ne 0) {
            throw "Swift installer exited with code $($installProcess.ExitCode)"
          }

          $installDurationSeconds = [math]::Round(($installEnd - $installStart).TotalSeconds, 3)

          $swiftExe = (Get-Command swift.exe -ErrorAction SilentlyContinue | Select-Object -First 1 -ExpandProperty Source)
          if (-not $swiftExe) {
            # Search depth is limited to keep scan fast while covering known Swift install layout.
            $searchDepth = [int]$env:SWIFT_SEARCH_DEPTH
            $searchRoots = ($env:SWIFT_ROOTS_JSON | ConvertFrom-Json) |
              ForEach-Object { $_ -replace '%USERPROFILE%', $env:USERPROFILE } |
              Where-Object { Test-Path -LiteralPath $_ }

            if ($searchRoots) {
              $swiftExe = Get-ChildItem -Path $searchRoots -Filter swift.exe -Recurse -Depth $searchDepth -ErrorAction SilentlyContinue |
                Select-Object -First 1 -ExpandProperty FullName
            }
          }

          $swiftBin = ''
          $swiftVersion = 'not available'
          $swiftProbeOutput = 'swift.exe was not found after installation'
          $swiftStatus = 'swift.exe was not found after installation'

          if ($swiftExe) {
            $swiftBin = Split-Path -Path $swiftExe -Parent
            "$swiftBin" >> $env:GITHUB_PATH

            $previousErrorActionPreference = $ErrorActionPreference
            $previousNativeCommandPreference = $PSNativeCommandUseErrorActionPreference
            try {
              $ErrorActionPreference = 'Continue'
              $PSNativeCommandUseErrorActionPreference = $false
              $swiftVersionOutput = & $swiftExe --version 2>&1
              $swiftVersionExitCode = $LASTEXITCODE
            } finally {
              $ErrorActionPreference = $previousErrorActionPreference
              $PSNativeCommandUseErrorActionPreference = $previousNativeCommandPreference
            }

            $swiftVersionText = ($swiftVersionOutput | Out-String).Trim()
            if ($swiftVersionExitCode -eq 0) {
              $swiftVersion = $swiftVersionText
              $swiftProbeOutput = $swiftVersionText
              $swiftStatus = 'swift.exe located and version command succeeded'
            } else {
              $swiftProbeOutput = if ($swiftVersionText) { $swiftVersionText } else { "swift.exe --version exited with code $swiftVersionExitCode" }
              $swiftStatus = "swift.exe located but version command failed (exit code $swiftVersionExitCode)"
            }
          }

          "installer_url=$installerUrl" >> $env:GITHUB_OUTPUT
          "installer_size_bytes=$downloadedInstallerSizeBytes" >> $env:GITHUB_OUTPUT
          "install_duration_seconds=$installDurationSeconds" >> $env:GITHUB_OUTPUT
          "swift_exe=$swiftExe" >> $env:GITHUB_OUTPUT
          "swift_bin=$swiftBin" >> $env:GITHUB_OUTPUT
          "swift_status=$swiftStatus" >> $env:GITHUB_OUTPUT
          "swift_probe_output<<EOF" >> $env:GITHUB_OUTPUT
          $swiftProbeOutput >> $env:GITHUB_OUTPUT
          "EOF" >> $env:GITHUB_OUTPUT
          "swift_version<<EOF" >> $env:GITHUB_OUTPUT
          $swiftVersion >> $env:GITHUB_OUTPUT
          "EOF" >> $env:GITHUB_OUTPUT

      - name: Build installation report
        shell: pwsh
        env:
          PRE_USED_BYTES: ${{ steps.before.outputs.pre_used_bytes }}
          PRE_FREE_BYTES: ${{ steps.before.outputs.pre_free_bytes }}
          PRE_TOTAL_BYTES: ${{ steps.before.outputs.pre_total_bytes }}
          INSTALLER_URL: ${{ steps.install.outputs.installer_url }}
          INSTALLER_SIZE_BYTES: ${{ steps.install.outputs.installer_size_bytes }}
          INSTALL_DURATION_SECONDS: ${{ steps.install.outputs.install_duration_seconds }}
          SWIFT_EXE: ${{ steps.install.outputs.swift_exe }}
          SWIFT_BIN: ${{ steps.install.outputs.swift_bin }}
          SWIFT_PROBE_OUTPUT: ${{ steps.install.outputs.swift_probe_output }}
          SWIFT_STATUS: ${{ steps.install.outputs.swift_status }}
          SWIFT_VERSION: ${{ steps.install.outputs.swift_version }}
        run: |
          $ErrorActionPreference = 'Stop'

          function Get-DirectorySizeBytes {
            param(
              [Parameter(Mandatory = $true)]
              [string]$Path
            )

            if (-not (Test-Path -LiteralPath $Path)) {
              return [int64]0
            }

            $measure = Get-ChildItem -LiteralPath $Path -Recurse -File -Force -ErrorAction SilentlyContinue |
              Measure-Object -Property Length -Sum
            if ($null -eq $measure.Sum) {
              return [int64]0
            }
            return [int64]$measure.Sum
          }

          $reportDir = Join-Path $env:RUNNER_TEMP 'swift-install-report'
          New-Item -ItemType Directory -Path $reportDir -Force | Out-Null

          $postDrive = Get-PSDrive -Name C
          $postUsedBytes = [int64]$postDrive.Used
          $postFreeBytes = [int64]$postDrive.Free
          $postTotalBytes = [int64]($postDrive.Used + $postDrive.Free)

          $preUsedBytes = [int64]$env:PRE_USED_BYTES
          $preFreeBytes = [int64]$env:PRE_FREE_BYTES
          $preTotalBytes = [int64]$env:PRE_TOTAL_BYTES

          $swiftRoots = ($env:SWIFT_ROOTS_JSON | ConvertFrom-Json) |
            ForEach-Object { $_ -replace '%USERPROFILE%', $env:USERPROFILE }
          $swiftRootsTotalSizeBytes = 0
          foreach ($root in $swiftRoots) {
            $swiftRootsTotalSizeBytes += Get-DirectorySizeBytes -Path $root
          }

          $usedDeltaBytes = $postUsedBytes - $preUsedBytes
          $freeDeltaBytes = $postFreeBytes - $preFreeBytes
          $usedDeltaGb = [math]::Round($usedDeltaBytes / 1GB, 3)

          $summaryLines = @()
          $summaryLines += '# Swift installation report (windows-11-arm)'
          $summaryLines += ''
          $summaryLines += '* Installer: direct .exe download'
          $summaryLines += "* Installer URL: $env:INSTALLER_URL"
          $summaryLines += "* Installer size: $env:INSTALLER_SIZE_BYTES bytes"
          $summaryLines += "* Installation duration: $env:INSTALL_DURATION_SECONDS seconds"
          $summaryLines += "* Swift executable: $env:SWIFT_EXE"
          $summaryLines += "* Swift bin directory: $env:SWIFT_BIN"
          $summaryLines += "* Swift probe status: $env:SWIFT_STATUS"
          $summaryLines += "* Swift reported version: $env:SWIFT_VERSION"
          $summaryLines += ''
          $summaryLines += '## Swift probe output'
          $summaryLines += ''
          $summaryLines += '```'
          $summaryLines += $env:SWIFT_PROBE_OUTPUT
          $summaryLines += '```'
          $summaryLines += ''
          $summaryLines += '## Disk usage on C:'
          $summaryLines += ''
          $summaryLines += '| Metric | Before (GB) | After (GB) | Delta (GB) |'
          $summaryLines += '| --- | ---: | ---: | ---: |'
          $summaryLines += "| Used | $([math]::Round($preUsedBytes / 1GB, 3)) | $([math]::Round($postUsedBytes / 1GB, 3)) | $([math]::Round(($postUsedBytes - $preUsedBytes) / 1GB, 3)) |"
          $summaryLines += "| Free | $([math]::Round($preFreeBytes / 1GB, 3)) | $([math]::Round($postFreeBytes / 1GB, 3)) | $([math]::Round(($postFreeBytes - $preFreeBytes) / 1GB, 3)) |"
          $summaryLines += "| Total | $([math]::Round($preTotalBytes / 1GB, 3)) | $([math]::Round($postTotalBytes / 1GB, 3)) | $([math]::Round(($postTotalBytes - $preTotalBytes) / 1GB, 3)) |"
          $summaryLines += ''
          $summaryLines += '## Swift directories total size'
          $summaryLines += ''
          $summaryLines += "* Estimated Swift footprint (tracked roots): $([math]::Round($swiftRootsTotalSizeBytes / 1GB, 3)) GB"
          $summaryLines += "* Used-space delta after installation: $usedDeltaGb GB"
          $summaryLines += "* Free-space delta after installation: $([math]::Round($freeDeltaBytes / 1GB, 3)) GB"

          $summaryPath = Join-Path $reportDir 'summary.md'
          $summaryLines | Set-Content -Path $summaryPath -Encoding UTF8
          Get-Content -Path $summaryPath | Add-Content -Path $env:GITHUB_STEP_SUMMARY

          $reportObject = [pscustomobject]@{
            installer_url = $env:INSTALLER_URL
            installer_size_bytes = [int64]$env:INSTALLER_SIZE_BYTES
            install_duration_seconds = [double]$env:INSTALL_DURATION_SECONDS
            swift_exe = $env:SWIFT_EXE
            swift_bin = $env:SWIFT_BIN
            swift_version = $env:SWIFT_VERSION
            pre_used_bytes = $preUsedBytes
            post_used_bytes = $postUsedBytes
            used_delta_bytes = $usedDeltaBytes
            pre_free_bytes = $preFreeBytes
            post_free_bytes = $postFreeBytes
            free_delta_bytes = $freeDeltaBytes
            swift_roots_size_bytes = [int64]$swiftRootsTotalSizeBytes
          }
          $reportObject | ConvertTo-Json -Depth 4 | Set-Content -Path (Join-Path $reportDir 'report.json') -Encoding UTF8

      - name: Upload installation report artifact
        uses: actions/upload-artifact@v4
        with:
          name: swift-install-report-windows-11-arm
          path: ${{ runner.temp }}/swift-install-report
