name: Install Swift on Windows ARM

on:
  workflow_dispatch:

permissions: {}

jobs:
  install-swift:
    runs-on: windows-11-arm
    env:
      SWIFT_INSTALLER_URL: https://download.swift.org/swift-6.3.3-release/windows10-arm64/swift-6.3.3-RELEASE/swift-6.3.3-RELEASE-windows10-arm64.exe

    steps:
      - name: Download Swift installer
        id: download
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installerUrl = $env:SWIFT_INSTALLER_URL
          $installerName = [System.IO.Path]::GetFileName($installerUrl)
          $installerPath = Join-Path $env:RUNNER_TEMP $installerName

          Write-Host "Downloading $installerUrl"
          Invoke-WebRequest -Uri $installerUrl -OutFile $installerPath

          if (-not (Test-Path -LiteralPath $installerPath)) {
            throw "Installer was not downloaded: $installerPath"
          }

          $signature = Get-AuthenticodeSignature -FilePath $installerPath
          if ($signature.Status -ne 'Valid') {
            throw "Invalid installer signature: $($signature.Status)"
          }

          "installer_path=$installerPath" >> $env:GITHUB_OUTPUT

      - name: Install Swift silently
        id: install
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installerPath = "${{ steps.download.outputs.installer_path }}"

          $installStart = Get-Date
          $process = Start-Process -FilePath $installerPath -ArgumentList '/quiet','/norestart' -Wait -PassThru
          $installEnd = Get-Date
          if ($process.ExitCode -ne 0) {
            throw "Installer failed with exit code $($process.ExitCode)"
          }

          $elapsed = $installEnd - $installStart
          Write-Host "Installation time: $([int]$elapsed.TotalMinutes)m $($elapsed.Seconds)s"
          "install_seconds=$([int]$elapsed.TotalSeconds)" >> $env:GITHUB_OUTPUT

          # Swift's Windows installer updates PATH outside the current process, so gather only the new
          # Machine/User PATH segments here and expose them to subsequent steps via GITHUB_PATH.
          $existingPathEntries = [System.Collections.Generic.HashSet[string]]::new([System.StringComparer]::OrdinalIgnoreCase)
          foreach ($pathEntry in ($env:Path -split ';' | Where-Object { $_ })) {
            $null = $existingPathEntries.Add($pathEntry)
          }

          foreach ($level in 'Machine', 'User') {
            $installedPath = [Environment]::GetEnvironmentVariable('Path', $level)
            foreach ($pathEntry in ($installedPath -split ';' | Where-Object { $_ })) {
              if ($existingPathEntries.Add($pathEntry)) {
                $pathEntry | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
              }
            }
          }

      - name: Print Swift version
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          swift --version

      - name: Report install stats
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          # Disk usage: find Swift install root from swift.exe location
          $swiftExe = (Get-Command swift -ErrorAction SilentlyContinue).Source
          if ($swiftExe) {
            # swift.exe lives in <install-root>\bin\swift.exe — go up two levels
            $swiftRoot = Split-Path (Split-Path $swiftExe -Parent) -Parent
            Write-Host "Swift installed at: $swiftRoot"
            $size = (Get-ChildItem -Recurse -Force -ErrorAction SilentlyContinue $swiftRoot | Measure-Object -Property Length -Sum).Sum
            $totalMB = [math]::Round($size / 1MB, 1)
            $totalGB = [math]::Round($size / 1GB, 2)
          } else {
            Write-Host "swift.exe not found in PATH"
            $totalMB = 0
            $totalGB = 0
          }
          Write-Host ""
          Write-Host "Total Swift disk usage: $totalMB MB ($totalGB GB)"
          Write-Host "Installation time     : ${{ steps.install.outputs.install_seconds }} seconds"
