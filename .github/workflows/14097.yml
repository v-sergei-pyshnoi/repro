name: Repro rust-toolchain on macos-15

on:
  workflow_dispatch:

jobs:
  repro:
    name: dtolnay/rust-toolchain / macos-15
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --locked --all-targets
