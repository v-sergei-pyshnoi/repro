name: Workflow Observability

on:
  workflow_dispatch:

jobs:
  collect:
    runs-on: ubuntu-latest

    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y jq gh
          gh --version

      - name: Collect workflow metrics
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DD_API_KEY: ${{ secrets.DATADOG_API_KEY }}
          REPO: v-sergei-pyshnoi/repro
        run: |
          set -euo pipefail

          workflows=(
            "SendMetric.yml"
          )

          for workflow in "${workflows[@]}"; do
            echo "Processing $workflow"

            gh api \
              "repos/$REPO/actions/workflows/$workflow/runs?per_page=10" \
              > runs.json

            jq -c '.workflow_runs[]' runs.json | while read -r run; do
              RUN_ID=$(echo "$run" | jq -r '.id')
              STATUS=$(echo "$run" | jq -r '.conclusion // "unknown"')

              START=$(echo "$run" | jq -r '.run_started_at')
              END=$(echo "$run" | jq -r '.updated_at')

              START_EPOCH=$(date -d "$START" +%s)
              END_EPOCH=$(date -d "$END" +%s)

              DURATION=$((END_EPOCH - START_EPOCH))

              jq -n \
                --arg repo "$REPO" \
                --arg workflow "$workflow" \
                --arg status "$STATUS" \
                --arg run_id "$RUN_ID" \
                --argjson timestamp "$START_EPOCH" \
                --argjson value "$DURATION" \
                '{
                  series: [
                    {
                      metric: "github.actions.workflow",
                      type: 3,
                      points: [
                        {
                          timestamp: $timestamp,
                          value: $value
                        }
                      ],
                      tags: [
                        ("repo:" + $repo),
                        ("workflow:" + $workflow),
                        ("status:" + $status),
                        ("run_id:" + $run_id)
                      ]
                    }
                  ]
                }' > payload.json

              curl -s \
                -X POST \
                "https://api.datadoghq.eu/api/v2/series" \
                -H "Content-Type: application/json" \
                -H "DD-API-KEY: $DD_API_KEY" \
                -d @payload.json

              echo "Sent run $RUN_ID"
            done
          done